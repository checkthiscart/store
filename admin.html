<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Admin | checkthiscart</title>
  <link rel="stylesheet" href="./site.css">
</head>
<body>
  <div class="admin-container" style="max-width: 800px; margin: 40px auto; padding: 20px; font-family: sans-serif;">
    <a href="./index.html">← View Live Site</a>
    <h1>Product Admin</h1>
    <p>Add, edit, and delete products. Nothing goes live until you push to GitHub.</p>
    
    <div style="background: #1e1e2f; color: #fff; padding: 20px; border-radius: 8px; margin-top: 20px;">
      <h3>Connect to GitHub</h3>
      <p style="font-size: 0.9rem; color: #ccc;">One-time setup. This saves to your browser only.</p>
      
      <form id="admin-config-form" style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px;">
        <label>GitHub Username
          <input type="text" id="cfg-user" value="checkthiscart" style="width: 100%; padding: 8px; margin-top: 4px;">
        </label>
        
        <label>Repository Name
          <input type="text" id="cfg-repo" value="store" style="width: 100%; padding: 8px; margin-top: 4px;">
        </label>
        
        <label>Branch
          <input type="text" id="cfg-branch" value="main" style="width: 100%; padding: 8px; margin-top: 4px;">
        </label>
        
        <label>Data File Path
          <input type="text" id="cfg-path" value="products.json" style="width: 100%; padding: 8px; margin-top: 4px;">
        </label>
        
        <label>Personal Access Token (PAT)
          <input type="password" id="cfg-token" placeholder="github_pat_..." style="width: 100%; padding: 8px; margin-top: 4px;">
        </label>
        
        <button type="submit" style="padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Save & Connect</button>
      </form>
    </div>
  </div>

  <script src="./site.js"></script>
</body>
</html>
