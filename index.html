<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>checkthiscart | Curated Product Reviews</title>
  <link rel="stylesheet" href="./site.css">
  <style>
    body { background: #0f1015; color: #e1e3ea; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; }
    header { padding: 20px 40px; border-bottom: 1px solid #232633; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: 900; font-size: 1.2rem; color: #fff; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
    .logo-badge { background: #f2ba49; color: #000; padding: 2px 6px; border-radius: 4px; }

    /* Dynamic Hero Section */
    .hero-banner { position: relative; padding: 60px 40px; text-align: center; background: #161822; border-bottom: 1px solid #232633; overflow: hidden; }
    .hero-bg-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.25; filter: blur(2px); pointer-events: none; }
    .hero-content { position: relative; z-index: 2; max-width: 800px; margin: 0 auto; }
    .hero-content h1 { font-size: 2.2rem; font-weight: 900; color: #fff; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .hero-content p { font-size: 1.05rem; color: #a0a5b5; margin-top: 0; }

    /* Container */
    .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
    .section-title { font-size: 1.2rem; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

    /* Category Nav Tabs */
    .category-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 30px; }
    .cat-tab { padding: 8px 16px; background: #181a24; border: 1px solid #282c3d; border-radius: 20px; color: #a0a5b5; font-size: 0.85rem; font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .cat-tab.active, .cat-tab:hover { background: #f2ba49; color: #000; border-color: #f2ba49; }

    /* Categories Grid */
    .categories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; margin-bottom: 50px; }
    .cat-card { background: #181a24; border: 1px solid #282c3d; border-radius: 10px; padding: 15px; display: flex; align-items: center; gap: 15px; }
    .cat-card img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; background: #222; }
    .cat-card h4 { margin: 0 0 4px 0; color: #fff; font-size: 0.95rem; }
    .cat-card p { margin: 0; font-size: 0.75rem; color: #888; }

    /* Trending Grid */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
    .product-card { background: #181a24; border: 1px solid #282c3d; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s; }
    .product-card:hover { transform: translateY(-3px); }
    .media-container { position: relative; width: 100%; height: 200px; background: #000; cursor: pointer; }
    .media-container img, .media-container video { width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 18px; flex: 1; display: flex; flex-direction: column; }
    .card-title { font-size: 1rem; font-weight: 800; color: #fff; margin: 0 0 8px 0; }
    .card-verdict { font-size: 0.85rem; color: #aaa; margin-bottom: 15px; flex: 1; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .price-tag { font-size: 1.1rem; font-weight: 900; color: #f2ba49; }
    .buy-btn { padding: 8px 14px; background: #28a745; color: #fff; text-decoration: none; font-weight: 800; font-size: 0.8rem; border-radius: 6px; text-transform: uppercase; }

    /* Lightbox Modal */
    .lightbox-modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); justify-content: center; align-items: center; }
    .lightbox-modal img { max-width: 85%; max-height: 80vh; border-radius: 8px; border: 2px solid #282c3d; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .lightbox-close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 2rem; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<!-- Lightbox Container -->
<div id="lightbox" class="lightbox-modal" onclick="closeLightbox()">
  <span class="lightbox-close">&times;</span>
  <img id="lightbox-img" src="" alt="Enlarged preview">
</div>

<header>
  <div class="logo">
    <span class="logo-badge">CTC</span> checkthiscart
  </div>
  <a href="https://www.pinterest.com/checkthiscart/" style="color:#aaa; text-decoration:none; font-size:0.85rem;">Follow me on Pinterest! &rarr;</a>
</header>

<!-- Dynamic Hero Banner -->
<section class="hero-banner">
  <img id="hero-bg" class="hero-bg-img" src="" style="display:none;" alt="Hero Banner Background">
  <div class="hero-content">
    <h1 id="hero-title">CURATED ESSENTIALS, TESTED FOR QUALITY</h1>
    <p id="hero-sub">Honest testing notes and verified recommendations for everyday upgrades.</p>
  </div>
</section>

<main class="container">

  <!-- Category List Section -->
  <div class="section-title">&#128194; EXPLORE CATEGORIES</div>
  <div id="category-tabs" class="category-tabs"></div>
  <div id="categories-grid" class="categories-grid"></div>

  <!-- Trending Products Section -->
  <div class="section-title">&#128293; TRENDING PRODUCTS &amp; REVIEWS</div>
  <div id="product-grid" class="product-grid"></div>

</main>

<script>
  let categories = JSON.parse(localStorage.getItem('ctc_categories')) || [
    { id: "kitchen-pantry", title: "Kitchen & Pantry", caption: "The only pantry organizers we recommend.", image: "", rating: "4.9" },
    { id: "smart-audio-tech", title: "Smart Audio & Tech", caption: "Gadgets and audio tech with major upgrades.", image: "", rating: "4.8" },
    { id: "home-organization", title: "Home Organization", caption: "Smart storage solutions for your home.", image: "", rating: "4.7" },
    { id: "gourmet-gifts", title: "Gourmet & Gifts", caption: "Thoughtful quality gifts for everyone.", image: "", rating: "4.9" }
  ];

  let heroData = JSON.parse(localStorage.getItem('ctc_hero')) || {
    headline: "CURATED ESSENTIALS, TESTED FOR QUALITY.",
    subtitle: "Honest testing notes and verified recommendations for everyday upgrades.",
    image: ""
  };

  let products = [];
  let currentFilter = 'all';

  /* --- LIGHTBOX FUNCTIONS --- */
  function openLightbox(src) {
    if (!src) return;
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').style.display = 'flex';
  }

  function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
  }

  /* --- LOAD HERO SECTION --- */
  function loadHeroSection() {
    if (heroData.headline) document.getElementById('hero-title').textContent = heroData.headline;
    if (heroData.subtitle) document.getElementById('hero-sub').textContent = heroData.subtitle;
    
    const bgImg = document.getElementById('hero-bg');
    if (heroData.image) {
      bgImg.src = heroData.image;
      bgImg.style.display = 'block';
    } else {
      bgImg.style.display = 'none';
    }
  }

  /* --- LOAD CATEGORIES --- */
  function loadCategories() {
    const tabsContainer = document.getElementById('category-tabs');
    const gridContainer = document.getElementById('categories-grid');

    // Render filter tabs
    tabsContainer.innerHTML = `
      <div class="cat-tab ${currentFilter === 'all' ? 'active' : ''}" onclick="filterCategory('all')">All Products</div>
      ${categories.map(c => `
        <div class="cat-tab ${currentFilter === c.id ? 'active' : ''}" onclick="filterCategory('${c.id}')">${c.title}</div>
      `).join('')}
    `;

    // Render category summary cards
    gridContainer.innerHTML = categories.map(c => `
      <div class="cat-card" onclick="filterCategory('${c.id}')" style="cursor:pointer;">
        ${c.image ? `<img src="${c.image}" alt="${c.title}" onclick="event.stopPropagation(); openLightbox('${c.image}')">` : '<div style="width:50px; height:50px; background:#222; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#555; font-size:0.7rem;">No Img</div>'}
        <div>
          <h4>${c.title}</h4>
          <p>${c.caption || 'Verified reviews'}</p>
        </div>
      </div>
    `).join('');
  }

  function filterCategory(catId) {
    currentFilter = catId;
    loadCategories();
    renderProducts();
  }

  /* --- FETCH & RENDER PRODUCTS --- */
  async function fetchCatalog() {
    const user = localStorage.getItem('gh_user') || 'checkthiscart';
    const repo = localStorage.getItem('gh_repo') || 'store';
    const path = localStorage.getItem('gh_path') || 'products.json';

    try {
      const res = await fetch(`https://raw.githubusercontent.com/${user}/${repo}/main/${path}`);
      if (!res.ok) throw new Error('Catalog file not found');
      const data = await res.json();
      
      // If structured payload exists, update local settings
      if (data.hero) {
        heroData = data.hero;
        localStorage.setItem('ctc_hero', JSON.stringify(heroData));
        loadHeroSection();
      }
      if (data.categories) {
        categories = data.categories;
        localStorage.setItem('ctc_categories', JSON.stringify(categories));
        loadCategories();
      }

      products = Array.isArray(data) ? data : (data.products || []);
      renderProducts();
    } catch (err) {
      console.warn('Falling back to local data/defaults:', err.message);
      renderProducts();
    }
  }

  function renderProducts() {
    const container = document.getElementById('product-grid');
    const filtered = currentFilter === 'all' ? products : products.filter(p => p.category === currentFilter);

    if (filtered.length === 0) {
      container.innerHTML = '<p style="color:#666;">No products available in this category.</p>';
      return;
    }

    container.innerHTML = filtered.map(p => {
      const isVideo = p.isVideo || (p.image && p.image.endsWith('.mp4'));
      return `
        <div class="product-card">
          <div class="media-container" onclick="openLightbox('${p.image}')">
            ${isVideo ? `<video src="${p.image}" autoplay loop muted playsinline></video>` : `<img src="${p.image}" alt="${p.title}">`}
          </div>
          <div class="card-body">
            <h3 class="card-title">${p.title}</h3>
            <p class="card-verdict">${p.verdict || ''}</p>
            <div class="card-footer">
              <span class="price-tag">${p.price || ''}</span>
              <a href="${p.link}" target="_blank" rel="noopener" class="buy-btn">View Deal &rarr;</a>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  // Initialize Page
  loadHeroSection();
  loadCategories();
  fetchCatalog();
</script>
</body>
</html>
