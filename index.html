<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>checkthiscart | Curated Reviews & Tested Products</title>
  <link rel="stylesheet" href="./site.css">
  <style>
    body { background: #0f1015; color: #e1e3ea; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding-bottom: 60px; }
    
    /* Navigation Header */
    header { padding: 18px 40px; background: #161822; border-bottom: 1px solid #232633; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .logo { font-weight: 900; font-size: 1.2rem; color: #fff; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .logo-badge { background: #f2ba49; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: 900; }
    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-links a { color: #a0a5b5; text-decoration: none; font-size: 0.85rem; font-weight: 600; transition: 0.2s; }
    .nav-links a:hover { color: #fff; }

    /* Dynamic Hero Section */
    .hero-banner { position: relative; padding: 70px 20px; text-align: center; background: #161822; border-bottom: 1px solid #232633; overflow: hidden; }
    .hero-bg-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.25; filter: blur(2px); pointer-events: none; }
    .hero-content { position: relative; z-index: 2; max-width: 800px; margin: 0 auto; }
    .hero-content h1 { font-size: 2.2rem; font-weight: 900; color: #fff; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
    .hero-content p { font-size: 1.05rem; color: #a0a5b5; margin: 0 auto 20px auto; max-width: 600px; line-height: 1.5; }

    /* Layout Containers */
    .container { max-width: 1100px; margin: 0 auto; padding: 35px 20px; }
    .section-title { font-size: 1.1rem; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }

    /* Category Filter Nav Bar */
    .category-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 30px; scrollbar-width: none; }
    .category-tabs::-webkit-scrollbar { display: none; }
    .cat-tab { padding: 8px 18px; background: #181a24; border: 1px solid #282c3d; border-radius: 20px; color: #a0a5b5; font-size: 0.85rem; font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .cat-tab.active, .cat-tab:hover { background: #f2ba49; color: #000; border-color: #f2ba49; }

    /* Category Cards Grid */
    .categories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; margin-bottom: 50px; }
    .cat-card { background: #181a24; border: 1px solid #282c3d; border-radius: 10px; padding: 15px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s; }
    .cat-card:hover { border-color: #f2ba49; transform: translateY(-2px); }
    .cat-card img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; background: #222; }
    .cat-card h4 { margin: 0 0 4px 0; color: #fff; font-size: 0.95rem; }
    .cat-card p { margin: 0; font-size: 0.75rem; color: #888; }

    /* Featured Highlights Row */
    .featured-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-bottom: 50px; }
    .featured-card { background: linear-gradient(145deg, #1d202d, #141620); border: 1px solid #f2ba49; border-radius: 12px; padding: 20px; display: flex; gap: 15px; align-items: center; }
    .featured-card img { width: 90px; height: 90px; border-radius: 8px; object-fit: cover; cursor: pointer; }
    .featured-info h4 { margin: 0 0 6px 0; color: #fff; font-size: 1rem; }
    .featured-info p { margin: 0 0 10px 0; font-size: 0.8rem; color: #aaa; }

    /* Product Review Stream Section */
    .product-stream { display: flex; flex-direction: column; gap: 30px; }
    .stream-card { background: #181a24; border: 1px solid #282c3d; border-radius: 14px; overflow: hidden; display: grid; grid-template-columns: 320px 1fr; transition: 0.2s; }
    .stream-card:hover { border-color: #3d435c; }
    .stream-media { position: relative; background: #000; width: 100%; height: 100%; min-height: 240px; cursor: pointer; }
    .stream-media img, .stream-media video { width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; }
    .stream-content { padding: 25px; display: flex; flex-direction: column; justify-content: space-between; }
    .stream-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .stream-title { font-size: 1.2rem; font-weight: 800; color: #fff; margin: 0; }
    .stream-rating { background: #232736; color: #f2ba49; font-weight: 800; font-size: 0.8rem; padding: 4px 8px; border-radius: 6px; }
    .stream-verdict { font-size: 0.9rem; color: #b0b5c6; margin-bottom: 15px; line-height: 1.4; }
    
    .pros-cons-box { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #0e1017; padding: 12px 15px; border-radius: 8px; margin-bottom: 20px; font-size: 0.8rem; }
    .pro-text { color: #5ddb88; }
    .con-text { color: #ff6b6b; }

    .stream-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #232736; padding-top: 15px; }
    .price-tag { font-size: 1.3rem; font-weight: 900; color: #f2ba49; }
    .buy-btn { padding: 10px 18px; background: #28a745; color: #fff; text-decoration: none; font-weight: 800; font-size: 0.85rem; border-radius: 6px; text-transform: uppercase; transition: 0.2s; }
    .buy-btn:hover { background: #218838; }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .stream-card { grid-template-columns: 1fr; }
      .stream-media { height: 200px; min-height: unset; }
      header { padding: 15px 20px; }
    }

    /* Lightbox Modal */
    .lightbox-modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); justify-content: center; align-items: center; }
    .lightbox-modal img { max-width: 85%; max-height: 80vh; border-radius: 8px; border: 2px solid #282c3d; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .lightbox-close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 2rem; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<!-- Lightbox Container -->
<div id="lightbox" class="lightbox-modal" onclick="closeLightbox()">
  <span class="lightbox-close">&times;</span>
  <img id="lightbox-img" src="" alt="Enlarged preview">
</div>

<!-- Header -->
<header>
  <a href="#" class="logo">
    <span class="logo-badge">CTC</span> checkthiscart
  </a>
  <div class="nav-links">
    <a href="#categories-section">Categories</a>
    <a href="#reviews-section">Reviews</a>
    <a href="./admin.html" style="color:#f2ba49;">Admin Panel &rarr;</a>
  </div>
</header>

<!-- Dynamic Hero Banner -->
<section class="hero-banner">
  <img id="hero-bg" class="hero-bg-img" src="" style="display:none;" alt="Hero Banner Background">
  <div class="hero-content">
    <h1 id="hero-title">CURATED ESSENTIALS, TESTED FOR QUALITY</h1>
    <p id="hero-sub">Honest testing notes and verified recommendations for everyday upgrades.</p>
  </div>
</section>

<main class="container">

  <!-- Explore Categories Section -->
  <div id="categories-section" class="section-title">&#128194; EXPLORE CATEGORIES</div>
  <div id="category-tabs" class="category-tabs"></div>
  <div id="categories-grid" class="categories-grid"></div>

  <!-- Featured Recommendations Row -->
  <div class="section-title">&#11088; FEATURED PICKS</div>
  <div id="featured-grid" class="featured-grid"></div>

  <!-- Full Product Reviews Stream -->
  <div id="reviews-section" class="section-title">&#128293; TESTED PRODUCTS &amp; REVIEWS</div>
  <div id="product-stream" class="product-stream"></div>

</main>

<script>
  let categories = JSON.parse(localStorage.getItem('ctc_categories')) || [
    { id: "kitchen-pantry", title: "Kitchen & Pantry", caption: "The only pantry organizers we recommend.", image: "", rating: "4.9" },
    { id: "smart-audio-tech", title: "Smart Audio & Tech", caption: "Gadgets and audio tech with major upgrades.", image: "", rating: "4.8" },
    { id: "home-organization", title: "Home Organization", caption: "Smart storage solutions for your home.", image: "", rating: "4.7" },
    { id: "gourmet-gifts", title: "Gourmet & Gifts", caption: "Thoughtful quality gifts for everyone.", image: "", rating: "4.9" }
  ];

  let heroData = JSON.parse(localStorage.getItem('ctc_hero')) || {
    headline: "CURATED ESSENTIALS, TESTED FOR QUALITY",
    subtitle: "Honest testing notes and verified recommendations for everyday upgrades.",
    image: ""
  };

  let products = [];
  let currentFilter = 'all';

  /* --- LIGHTBOX ENLARGE --- */
  function openLightbox(src) {
    if (!src) return;
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').style.display = 'flex';
  }

  function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
  }

  /* --- LOAD HERO BANNER --- */
  function loadHeroSection() {
    if (heroData.headline) document.getElementById('hero-title').textContent = heroData.headline;
    if (heroData.subtitle) document.getElementById('hero-sub').textContent = heroData.subtitle;
    
    const bgImg = document.getElementById('hero-bg');
    if (heroData.image) {
      bgImg.src = heroData.image;
      bgImg.style.display = 'block';
    } else {
      bgImg.style.display = 'none';
    }
  }

  /* --- LOAD CATEGORIES & TABS --- */
  function loadCategories() {
    const tabsContainer = document.getElementById('category-tabs');
    const gridContainer = document.getElementById('categories-grid');

    tabsContainer.innerHTML = `
      <div class="cat-tab ${currentFilter === 'all' ? 'active' : ''}" onclick="filterCategory('all')">All Products</div>
      ${categories.map(c => `
        <div class="cat-tab ${currentFilter === c.id ? 'active' : ''}" onclick="filterCategory('${c.id}')">${c.title}</div>
      `).join('')}
    `;

    gridContainer.innerHTML = categories.map(c => `
      <div class="cat-card" onclick="filterCategory('${c.id}')">
        ${c.image ? `<img src="${c.image}" alt="${c.title}" onclick="event.stopPropagation(); openLightbox('${c.image}')">` : '<div style="width:50px; height:50px; background:#222; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#555; font-size:0.7rem;">No Img</div>'}
        <div>
          <h4>${c.title}</h4>
          <p>${c.caption || 'Verified reviews'}</p>
        </div>
      </div>
    `).join('');
  }

  function filterCategory(catId) {
    currentFilter = catId;
    loadCategories();
    renderProducts();
  }

  /* --- RENDER PRODUCTS & FEATURED PICKS --- */
  function renderProducts() {
    const streamContainer = document.getElementById('product-stream');
    const featuredContainer = document.getElementById('featured-grid');
    const filtered = currentFilter === 'all' ? products : products.filter(p => p.category === currentFilter);

    // Render Featured Picks (first 2 items)
    if (products.length > 0) {
      const topPicks = products.slice(0, 2);
      featuredContainer.innerHTML = topPicks.map(p => `
        <div class="featured-card">
          <img src="${p.image}" alt="${p.title}" onclick="openLightbox('${p.image}')">
          <div class="featured-info">
            <h4>${p.title}</h4>
            <p>${p.verdict ? p.verdict.substring(0, 70) + '...' : ''}</p>
            <a href="${p.link}" target="_blank" class="buy-btn" style="padding:6px 12px; font-size:0.75rem;">Check Price (${p.price}) &rarr;</a>
          </div>
        </div>
      `).join('');
    } else {
      featuredContainer.innerHTML = '<p style="color:#666;">No featured picks available.</p>';
    }

    // Render Main Product Review Stream
    if (filtered.length === 0) {
      streamContainer.innerHTML = '<p style="color:#666;">No products available in this category.</p>';
      return;
    }

    streamContainer.innerHTML = filtered.map(p => {
      const isVideo = p.isVideo || (p.image && p.image.endsWith('.mp4'));
      return `
        <div class="stream-card">
          <div class="stream-media" onclick="openLightbox('${p.image}')">
            ${isVideo ? `<video src="${p.image}" autoplay loop muted playsinline></video>` : `<img src="${p.image}" alt="${p.title}">`}
          </div>
          <div class="stream-content">
            <div>
              <div class="stream-header">
                <h3 class="stream-title">${p.title}</h3>
                <span class="stream-rating">&#9733; ${p.rating || '4.8'}</span>
              </div>
              <p class="stream-verdict">${p.verdict || ''}</p>
              
              ${(p.pros || p.cons) ? `
                <div class="pros-cons-box">
                  <div class="pro-text"><strong>PROS:</strong> ${p.pros || 'N/A'}</div>
                  <div class="con-text"><strong>CONS:</strong> ${p.cons || 'N/A'}</div>
                </div>
              ` : ''}
            </div>

            <div class="stream-footer">
              <span class="price-tag">${p.price || ''}</span>
              <a href="${p.link}" target="_blank" rel="noopener" class="buy-btn">View Deal &rarr;</a>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  /* --- FETCH DATA --- */
  async function fetchCatalog() {
    const user = localStorage.getItem('gh_user') || 'checkthiscart';
    const repo = localStorage.getItem('gh_repo') || 'store';
    const path = localStorage.getItem('gh_path') || 'products.json';

    try {
      const res = await fetch(`https://raw.githubusercontent.com/${user}/${repo}/main/${path}`);
      if (!res.ok) throw new Error('Catalog file not found');
      const data = await res.json();
      
      if (data.hero) {
        heroData = data.hero;
        localStorage.setItem('ctc_hero', JSON.stringify(heroData));
        loadHeroSection();
      }
      if (data.categories) {
        categories = data.categories;
        localStorage.setItem('ctc_categories', JSON.stringify(categories));
        loadCategories();
      }

      products = Array.isArray(data) ? data : (data.products || []);
      renderProducts();
    } catch (err) {
      console.warn('Falling back to local data/defaults:', err.message);
      renderProducts();
    }
  }

  // Initialize Page
  loadHeroSection();
  loadCategories();
  fetchCatalog();
</script>
</body>
</html>
